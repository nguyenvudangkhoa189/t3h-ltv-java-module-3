spring.application.name=demo-bai5-mongodb-spring

# Kết nối MongoDB (cùng database với Bài 3/4).
spring.data.mongodb.uri=mongodb://localhost:27017/db_java_t3h_module3

# Bật khi dùng Transaction (§8.2 syllabus) — MongoDB phải chạy Replica Set:
# spring.data.mongodb.uri=mongodb://localhost:27017/db_java_t3h_module3?replicaSet=rs0

# Phân trang danh sách nhà hàng
app.restaurants.page-size=10

# Tự nạp dữ liệu mẫu (restaurants + items) khi cả 2 collection đều rỗng
app.restaurants.seed-on-startup=true
