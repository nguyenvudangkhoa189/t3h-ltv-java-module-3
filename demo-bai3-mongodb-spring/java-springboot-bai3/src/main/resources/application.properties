spring.application.name=demo-bai3-mongodb-spring

# Kết nối MongoDB. Đổi tên database nếu cần.
spring.data.mongodb.uri=mongodb://localhost:27017/db_java_t3h_module3

# Phân trang danh sách movie (phần Thymeleaf)
app.movies.page-size=5

# Tự động nạp dữ liệu mẫu khi collection rỗng
app.movies.seed-on-startup=true
