<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/layout :: head('Admin Movies')}"></head>
<body>
<div class="admin-shell">
    <div th:replace="~{admin/fragments/layout :: sidebar('movies')}"></div>
    <main class="admin-main">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Movies</h1>
            <a class="btn btn-primary" th:href="@{/admin/movies/new}">Thêm phim</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="stat-card">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Type</th>
                    <th>Country</th>
                    <th>Year</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movies}">
                    <td th:text="${m.title}">Title</td>
                    <td th:text="${m.type}">Movie</td>
                    <td th:text="${m.country}">—</td>
                    <td th:text="${m.releaseYear}">0</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/movies/{id}/edit(id=${m.id})}">Sửa</a>
                        <form class="d-inline" th:action="@{/admin/movies/{id}/delete(id=${m.id})}" method="post"
                              onsubmit="return confirm('Xóa phim này?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-3" th:if="${totalPages > 1}">
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/movies(page=${currentPage - 1})}">Prev</a>
                </li>
                <li class="page-item disabled"><span class="page-link"
                    th:text="'Trang ' + (${currentPage} + 1) + ' / ' + ${totalPages}"></span></li>
                <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/movies(page=${currentPage + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </main>
</div>
<div th:replace="~{admin/fragments/layout :: scripts}"></div>
</body>
</html>
