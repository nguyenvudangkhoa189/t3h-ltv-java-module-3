<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Upload Restaurants')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main>
    <h1>Thêm dữ liệu từ file</h1>

    <!-- Sau khi bấm Upload, form gửi file lên server theo đường dẫn trong "action" -->
    <form action="/restaurants/upload" method="post" enctype="multipart/form-data">
        <label for="file">Chọn file NDJSON (mỗi dòng là 1 object restaurant):</label><br/>
        <input id="file" name="file" type="file" accept=".json,.ndjson" required/><br/><br/>
        <button type="submit">Upload</button>
    </form>

    <div class="status" th:if="${message}">
        <h3>Status</h3>
        <p th:text="${message}"></p>
        <p th:if="${importCount != null}">
            Imported Count: <span th:text="${importCount}"></span>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
